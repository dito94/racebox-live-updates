<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="100" fill="#1E1E2F"/>
  
  <!-- Stopwatch Circle -->
  <circle cx="256" cy="256" r="160" fill="#2D2D44" stroke="#FFFFFF" stroke-width="10"/>

  <!-- Stopwatch top button -->
  <rect x="236" y="85" width="40" height="20" rx="5" fill="#FFFFFF"/>

  <!-- Stopwatch hand -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#FF4C4C" stroke-width="10" stroke-linecap="round"/>

  <!-- Rally road (winding path) -->
  <path d="M140,390 C200,340 310,430 370,370" fill="none" stroke="#4CAF50" stroke-width="12" stroke-linecap="round" stroke-dasharray="15,15"/>

  <!-- Start flag -->
  <rect x="130" y="370" width="20" height="40" fill="#FFF"/>
  <path d="M150,370 q20,10 0,20 q-20,10 0,20" fill="#FF4C4C"/>

  <!-- End flag -->
  <rect x="360" y="350" width="20" height="40" fill="#FFF"/>
  <path d="M360,350 q-20,10 0,20 q20,10 0,20" fill="#2196F3"/>
</svg>
