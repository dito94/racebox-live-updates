<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gaugeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="240" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="232" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>
  <!-- Gauge Arc -->
  <path d="M 200.23 692.00 A 360 360 0 1 1 823.77 692.00" fill="none" stroke="url(#gaugeGrad)" stroke-width="50" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Tick Marks -->
<line x1="176.0" y1="706.0" x2="167.3" y2="711.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="137.2" y1="612.4" x2="127.6" y2="615.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="124.0" y1="512.0" x2="114.0" y2="512.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
