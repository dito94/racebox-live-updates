<line x1="176.0" y1="318.0" x2="167.3" y2="313.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="237.6" y1="237.6" x2="230.6" y2="230.6" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="318.0" y1="176.0" x2="313.0" y2="167.3" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="411.6" y1="137.2" x2="409.0" y2="127.6" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="512.0" y1="124.0" x2="512.0" y2="114.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="612.4" y1="137.2" x2="615.0" y2="127.6" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="706.0" y1="176.0" x2="711.0" y2="167.3" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="786.4" y1="237.6" x2="793.4" y2="230.6" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="848.0" y1="318.0" x2="856.7" y2="313.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="886.8" y1="411.6" x2="896.4" y2="409.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="900.0" y1="512.0" x2="910.0" y2="512.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
<line x1="886.8" y1="612.4" x2="896.4" y2="615.0" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <!-- Satellite Symbol -->
  <g transform="translate(512.0, 312.0)">
    <line x1="0" y1="-35" x2="0" y2="-60" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M -18 -60 C -18 -85, 18 -85, 18 -60 Z" fill="#3b82f6"/>
    <rect x="-25" y="-35" width="50" height="70" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="-15" y="-20" width="30" height="20" rx="2" fill="#1e293b" opacity="0.5"/>
    <!-- Left Panel -->
    <rect x="-140" y="-15" width="85" height="35" rx="3" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <path d="M -140 -5 L -55 -5 M -140 5 L -55 5" stroke="#3b82f6" stroke-width="1"/>
    <line x1="-140" y1="0" x2="-25" y2="0" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Right Panel -->
    <rect x="55" y="-15" width="85" height="35" rx="3" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 55 -5 L 140 -5 M 55 5 L 140 5" stroke="#3b82f6" stroke-width="1"/>
    <line x1="55" y1="0" x2="140" y2="0" stroke="#cbd5e1" stroke-width="4"/>
  </g>
  <!-- Needle -->
  <line x1="512.0" y1="512.0" x2="741.1025971044414" y2="282.8974028955586" stroke="#ff9f43" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="512.0" y1="512.0" x2="741.1025971044414" y2="282.8974028955586" stroke="#ff9f43" stroke-width="5" stroke-linecap="round"/>
  <!-- Pivot Point -->
  <circle cx="512.0" cy="512.0" r="30" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="512.0" cy="512.0" r="12" fill="#e2e8f0"/>
  <!-- "NSAT" -->
  <text x="512.0" y="707.0" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="260px" fill="#f1f5f9" text-anchor="middle" letter-spacing="-8">NSAT</text>
  <text x="512.0" y="707.0" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="260px" fill="#1e40af" text-anchor="middle" letter-spacing="-8" opacity="0.3" transform="translate(0, 8)">NSAT</text>
  <!-- Underline -->
  <line x1="320" y1="787.0" x2="704" y2="787.0" stroke="#3b82f6" stroke-width="4" opacity="0.9"/>
  <!-- Subtitle -->
  <text x="512.0" y="877.0" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48px" fill="#94a3b8" text-anchor="middle" letter-spacing="6">GPS RACE TIMER</text>
